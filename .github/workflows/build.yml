# Compila CapCom para Mac (universal: Apple Silicon + Intel) y Windows.
# - En cada push o pull request: deja los archivos listos en la pestaña "Actions" (Artifacts).
# - Al crear una etiqueta vX.Y.Z (por ejemplo v1.0.0): publica una Release con los .zip para descargar.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCAPCOM_INSTALL_AFTER_BUILD=OFF

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        run: |
          A=build/CapCom_artefacts/Release
          lipo -info "$A/VST3/CapCom.vst3/Contents/MacOS/CapCom"
          mkdir -p dist/CapCom-Mac
          cp -R "$A/AU/CapCom.component" "$A/VST3/CapCom.vst3" "$A/Standalone/CapCom.app" dist/CapCom-Mac/
          # Firma ad hoc (sin cuenta de desarrollador): necesaria para que macOS cargue el plugin
          for b in dist/CapCom-Mac/*; do codesign --force --deep --sign - "$b"; done
          cp docs/INSTALAR-MAC.txt dist/CapCom-Mac/
          cd dist && ditto -c -k --keepParent CapCom-Mac CapCom-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CapCom-Mac
          path: dist/CapCom-Mac.zip

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CapCom-Mac.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $A = "build/CapCom_artefacts/Release"
          New-Item -ItemType Directory -Force dist/CapCom-Windows | Out-Null
          Copy-Item -Recurse "$A/VST3/CapCom.vst3" dist/CapCom-Windows/
          Copy-Item "$A/Standalone/CapCom.exe" dist/CapCom-Windows/
          Copy-Item docs/INSTALAR-WINDOWS.txt dist/CapCom-Windows/
          Compress-Archive -Path dist/CapCom-Windows -DestinationPath dist/CapCom-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CapCom-Windows
          path: dist/CapCom-Windows.zip

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CapCom-Windows.zip

  biblioteca:
    # La biblioteca de sonidos va aparte para que la descarga del plugin sea liviana
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar
        run: zip -r -q CapCom-Biblioteca.zip Biblioteca
      - uses: softprops/action-gh-release@v2
        with:
          files: CapCom-Biblioteca.zip
